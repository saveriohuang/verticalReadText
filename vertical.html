<!DOCTYPE html>
<html>
<head>
  <title>讀文字檔直書顯示</title>
  <META http-equiv="Content-Type" content="text/html; charset=utf-8">
  
  <style>
    html, body {
      height: 100%;
      margin: 0;
      display: flex;
      flex-direction: column;
    }
    /* 2. 新增的捲動容器 */
    .scroll-container {
      flex-grow: 1;         /* 填滿剩餘高度 */
      margin: 10px;         /* 距離邊緣 10px */
      overflow-y: auto;     /* 開啟垂直捲軸 */
      overflow-x: hidden;   /* 隱藏水平捲軸 */
      background: #343F5F;  /* 設定與 newspaper 相同的底色，視覺上才統一 */
      width: calc(100% - 20px);
      box-sizing: border-box;
    }
    
    body {
      height: 100vh; /* 強制 body 佔滿螢幕 */
      overflow: hidden; /* 避免外層出現捲軸 */
      background: #343F4F;
      font-size: 16px;
      color: white;
      background-image: url("images/jGlzr.png");
      /* 設定文字背景圖  */
      display: flex;         /* 使用 flex 佈局 */
      flex-direction: column; /* 讓表格跟文字區垂直排列 */
    }
    
    .wrapper {
      height: 22px;
      min-width: 50px;
      width: 80px;
      display: flex;
      align-items: center;
      justify-content:center;
      background: #FFF;
      border-radius: 6px;
      box-shadow: 0 5px 10px rgba(0, 0, 0, 0.2);
      flex-shrink: 0; 
    }

    .wrapper span {
      width: 30px;
      text-align: center;
      font-size: 18px;
      font-weight: 300;
      cursor: pointer;
      user-select: none;
      color: black;
    }

    .wrapper span.num {
      border-right: 2px solid rgba(0, 0, 0, 0.2);
      border-left: 2px solid rgba(0, 0, 0, 0.2);
      
    }

    .systemFone {
      color: white;
    }
    .settingcontainer{
      display: flex;
      flex-wrap:wrap;
      justify-content: flex-start; /* 改為 flex-start 讓元件靠左緊貼 */
      align-items: center;
      padding: 5px; /* 增加一點外框內距 */
    }
    .setting{
      display: flex;       /* 確保內部的 label 與 input/wrapper 水平排列 */
      align-items: center; /* 確保內部元件垂直居中 */
      margin: 5px 15px 5px 0; /* 右邊固定留 15px 間距，上方保留一點空間 */
      padding: 2px;
      
    }
/* 2. 針對表格微調，確保它不會擠壓到 newspaper */
    table {
      flex-shrink: 0; /* 確保表格高度固定，不被壓縮 */
      margin: 10px 10px 0 10px; /* 上左右邊距 10px */
    }

    .newspaper {
      writing-mode: vertical-rl;
      column-count: 2;
      padding: 20px;
      
      /* 重要：移除原本的 height: calc... 或 flex-grow */
      height: auto;         /* 讓高度隨內容撐開，進而觸發父層的捲軸 */
      min-height: 100%;     /* 確保內容少時也能填滿底色 */
      width: 100%;          /* 寬度隨父層 */
      line-height: 22px;
      letter-spacing: 3px;
      background-image: url("images/jGlzr.png");
      font-size: 16px;
      font-weight: 150;
      text-align: left;
      text-justify: distribute;
      text-orientation: upright;

      /* 為了美觀，取消 newspaper 原本的 margin，改由父層控制 */
      margin: 0;
      
      color: yellow;
      background: #343F5F;
      box-sizing: border-box; 
      opacity: .5;
    }
    .newspaper::-webkit-scrollbar {
      height: 8px; /* 水平捲軸高度 */
    }

    .newspaper::-webkit-scrollbar-track {
      background: #2A3340; /* 捲軸軌道顏色 */
    }

    .newspaper::-webkit-scrollbar-thumb {
      background: #555; /* 捲軸本體顏色 */
      border-radius: 4px;
    }

    .newspaper::-webkit-scrollbar-thumb:hover {
      background: #888;
    }
  </style>

</head>

<body>
  <div class="settingcontainer">
    <div class="setting">
      <label style="cursor: pointer;">
        <input style="display:none;" type="file" name="rf" id="infl">
        上傳文字檔
      </label>
    </div>
    <div class="setting">
        <label>&nbsp&nbsp</label>
        <select name="pageHight" onchange="changeHeight(this.value)">
          <option value="">選擇頁高</option>
          <option value="100">100px</option>
          <option value="200">200px</option>
          <option value="300">300px</option>
          <option value="500">500px</option>
          <option value="600" selected="selected">600px</option>
          <option value="800">800px</option>
          <option value="1080">1080px</option>
          <option value="1440">1440px</option>
          <option value="1980">1980px</option>
        </select>
    </div>
    <div class="setting">
      <label>字大小</label>
        <select name="FoneHight" onchange="changeFoneSize(this.value)">
          <option value="12">8</option>
          <option value="14">10</option>
          <option value="16" selected="selected">12</option>
          <option value="18">14</option>
          <option value="20">16</option>
          <option value="22">18</option>
          <option value="24">20</option>
          <option value="28">24</option>
          <option value="32">28</option>
          <option value="38">32</option>
          <option value="45">38</option>
        </select>
    </div>
    <div class="setting">
      <label>字型選擇</label>
          <select name="FomeFamily" onchange="changeFoneFamily(this.value)">
            <option value="新細明體">新細明體</option>
            <option value="標楷體">標楷體</option>
            <option value="微軟正黑體" selected="selected">微軟正黑體</option>
          </select>
    </div>
    <div class="setting">
      <input type="checkbox" id="bold" name="bold" onchange="changefontWeight(this.value)"/>粗體
    </div>
    <div class="setting">
      <label>行高</label>
      <select name="pageHight" onchange="changeRowHeight(this.value)">
        <option value="20">20</option>
        <option value="22" selected="selected">22</option>
        <option value="24">24</option>
        <option value="26">26</option>
        <option value="28">28</option>
        <option value="30">30</option>
        <option value="32">32</option>
        <option value="34">34</option>
        <option value="38">38</option>
        <option value="44">44</option>
        <option value="50">50</option>
        <option value="58">58</option>
        <option value="70">70</option>
      </select>
    </div>
    <div class="setting">
      <label>字距</label>
      <select name="letterSpacing" onchange="changeletterSpacing(this.value)">
        <option value="2">2</option>
        <option value="3" selected="selected">3</option>
        <option value="4">4</option>
        <option value="6">6</option>
        <option value="8">8</option>
        <option value="10">10</option>
        <option value="12">12</option>
        <option value="15">15</option>
        <option value="20">20</option>
      </select>
    </div>
    <div class="setting">
      <label>文字顏色</label>
      <input id="foneColorSet" type="color" value="#ffff00" onchange="changeFonecolor(this.value)" />
    </div>
    <div class="setting">

      <label>底色</label>
      <input id="backgroundColorPick" type="color" value="#343F4F" onchange="changeBKgroundcolor(this.value)" />
    </div>
    <div class="setting">
      <label>底色透明度</label>
      <input id="backGrndTrans" type="range" value="50"  oninput="changeBKopacity(this.value)" style="width: 80px;"/>
    </div>
    <div class="setting">
      <label>系統文字顏色</label>
      <input id="foneColorPick" type="color" value="#ffffff" onchange="changeSysFonecolor(this.value)" />
    </div>
    
    <div class="setting" style="display: flex; align-items: center;">
      <label style="white-space: nowrap; margin-right: 5px;">欄數</label>
      <div class="wrapper">
        <span class="minus">-</span>
        <span class="num">05</span>
        <span class="plus">+</span>
      </div>
    </div>
     
  
  </div>  
  <div class="scroll-container">
    <div id="res" class="newspaper"></div>
  </div>

  <script>
    document.getElementById('infl').addEventListener('change', function() {
      var file_reader = new FileReader();
      file_reader.onload = function() {
        document.getElementById('res').textContent = file_reader.result;
      }
      file_reader.readAsText(this.files[0]);
    })
    const thisbody = document.querySelector("body")
    const plus = document.querySelector(".plus"),
      minus = document.querySelector(" .minus"),
      num = document.querySelector(".num");
    let a = 2;
    const element = document.querySelector('.newspaper');
    plus.addEventListener("click", () => {
      a++;
      element.style.columnCount = a;
      a = (a < 10) ? "0" + a : a;
      num.innerText = a;
      console.log(a);
    });
    minus.addEventListener("click", () => {
      if (a > 1) {
        a--;
        element.style.columnCount = a;
        a = (a < 10) ? "0" + a : a;
        num.innerText = a;
        console.log(a);
      }
    });

    function changeHeight(pxstr) {
      element.style.height = pxstr + 'px';
    }

    function changeFoneSize(sizestr) {
      element.style.fontSize = sizestr + 'px';
    }
    function changefontWeight(fontWeighchk) {
      var bold= document.getElementById("bold");
      if (bold.checked == true){
        element.style.fontWeight = '600';
      } 
      else{
        element.style.fontWeight = '150';
      }
        
    }
    function changeletterSpacing(Spacstr) {
      element.style.letterSpacing = Spacstr + 'px';
    }
    function changeFoneFamily(Familystr) {
      element.style.fontFamily = Familystr;
    }
    function changeRowHeight(heightstr) {
      element.style.lineHeight = heightstr + 'px';
    }

    function changeFonecolor(colorstr) {
      element.style.color = colorstr;
    }

    function changeBKgroundcolor(colorstr) {
      //element.style.background = colorstr;
      var opacity = document.getElementById("backGrndTrans").value;
      var r = parseInt(colorstr.slice(1, 3), 16);
      var g = parseInt(colorstr.slice(3, 5), 16);
      var b = parseInt(colorstr.slice(5, 7), 16);
      var alpha = opacity / 100;
      element.style.backgroundColor = `rgba(${r}, ${g}, ${b}, ${alpha})`;
    }

    function changeSysFonecolor(colorstr) {
      thisbody.style.color = colorstr;
    }

    function changeBKopacity(opacitystr) {
      // 取得目前的底色選擇器數值 (例如 #343f5f)
      var hexColor = document.getElementById("backgroundColorPick").value;
      
      // 將 Hex 轉換為 RGB
      var r = parseInt(hexColor.slice(1, 3), 16);
      var g = parseInt(hexColor.slice(3, 5), 16);
      var b = parseInt(hexColor.slice(5, 7), 16);
      
      // 計算 alpha (0-1)
      var alpha = opacitystr / 100;
      
      // 只改變背景色的透明度，不影響文字
      element.style.backgroundColor = `rgba(${r}, ${g}, ${b}, ${alpha})`;
  }
  </script>
</body>


</html>
